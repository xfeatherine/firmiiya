<b>Aquí el mar guarda lo que aún no se nombra</b>

<div class="MM039-img" style="background-image: url(https://i.imgur.com/SI1n3uW.png)"></div>
<div class="MM039-x">El último hechizo había resonado en el exterior del Castillo, suficiente para dejar claro el resultado sin necesidad de que nadie dijera nada. Galatea mantuvo la varita baja unos segundos más, mirando desde el suelo el espacio entre ambos, como si aún estuviera siguiendo algo que ya no estaba ahí. No parecía especialmente frustrada, solo se mantuvo quieta.

Iggy, al otro lado, dejó escapar una sonrisa ladeada, más por la inercia del momento que por orgullo.

—Has estado muy bien —dijo, acercándose un par de pasos—. Si hubieras lanzado un segundo antes, el resultado habría sido diferente.

No era del todo cierto, pero tampoco sonaba a mentira. Galatea alzó la vista hacia él, parpadeando con lentitud.

—Me quedé pensando.

—Ya —respondió él, sin burla, más bien con cierta familiaridad—. Lo sueles hacer.

No añadió nada más. Tampoco hacía falta. Se entendían lo suficiente como para no estirar demasiado las cosas. Ae apareció poco después, llamando a Iggy con un gesto de cabeza.

—Voy con ella un rato —comentó, señalando con el pulgar hacia atrás—. Luego si quieres repetimos.

Galatea asintió ligeramente, ya algo distraída otra vez, y los vio alejarse sin más. No había prisa en su forma de recoger, ni tampoco en la decisión de marcharse después hacia la enfermería. El escozor en el brazo no era gran cosa, pero sí lo bastante molesto como para prestarle atención.

Madame Pomfrey no estaba cuando llegó a la Enfermería, así que ocupó una de las camas sin hacer ruido y empezó a apañarse sola. Desenrolló una venda con cuidado, deteniéndose a mitad de gesto para observar cómo caía la tela entre sus dedos, como si ese simple movimiento tuviera algo que decirle. Luego tomó uno de los frascos de su túnica, lo abrió con cautela y olió el contenido antes de usarlo, intentando recordar cómo lo hacían las sacerdotisas de su templo. 

Estaba concentrada en eso cuando la puerta se abrió de nuevo, con mucha más prisa que antes. Ignatius entró con el pelo algo revuelto y la respiración todavía un poco acelerada, como si no hubiera esperado a recuperarse antes de salir de donde estuviera. Tenía una marca rojiza en la mejilla y otra en la muñeca, y aunque no parecía grave, sí lo suficiente como para que se notara que el entrenamiento había ido peor que el anterior.

—Vale —soltó al entrar, medio riéndose—. Ae es muy habilidosa.

Galatea levantó la vista. Lo observó un momento en silencio, deteniéndose en los detalles sin decir nada de inmediato.

—¿Te ha dado fuerte?

—Un poco —respondió él, dejándose caer en la cama de al lado—. Pero bien, o sea… —se encogió de hombros—. Aprendo de verdad de esta forma.

No sonaba molesto. Más bien algo frustrado, pero con esa manera ligera que no termina de quedarse. Galatea dejó lo que estaba haciendo y se levantó, acercándose despacio. Tomó el mismo frasco que había estado usando antes, dudando apenas un instante antes de abrirlo, repasando mentalmente algo que había visto hacer otras veces.

—Te va a escocer un poco —dijo, casi en un murmullo, mientras se sentaba a su lado.

Iggy giró la cabeza hacia ella, apoyando el codo sobre su propia pierna.

—Confío en ti.

Galatea empezó a aplicar el ungüento con cuidado sobre la piel enrojecida. Sus movimientos eran suaves, algo lentos, pero atentos. No parecía insegura, solo estaba concentrada en no hacerle daño. Iggy hizo una pequeña mueca al principio, pero luego relajó el gesto.

—No se te da mal —comentó, mirándola de reojo—. En serio.

Galatea no respondió enseguida. Terminó de cubrir la zona antes de coger una venda.

—Lo he visto hacer muchas veces.

—Ya, pero verlo no es lo mismo.

Ella se encogió ligeramente de hombros, como si no terminara de darle importancia. Hubo un silencio breve, cómodo. 

—Igual deberíamos entrenar más —dijo—. Tú y yo. Pero sin que nadie nos meta prisa.

Galatea terminó de ajustar la venda con un gesto sencillo.

—Vale.

No había entusiasmo exagerado en su voz, pero sí algo parecido a una decisión tranquila. Se apartó después, dejando el frasco en su sitio.

—Ae es rápida —añadió él, mirando al techo—. Pero tú ves cosas antes.

Galatea se quedó quieta un segundo.

—A veces —murmuró. No parecía convencida del todo, pero tampoco lo negaba. Iggy cerró los ojos un momento, respirando más despacio.

—Gracias, Galatea.

Ella asintió apenas, levantándose del asiento con la mirada desviándose otra vez hacia la mesa de Madame Pomfrey. </div>

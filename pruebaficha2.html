<div class="MM039-x" style="color: #5C4033; background-color: rgba(244, 217, 157, 0.3); padding: 15px; border-left: 4px solid #D4A574;">El último hechizo había resonado en el exterior del Castillo, suficiente para dejar claro el resultado sin necesidad de que nadie dijera nada. Galatea mantuvo la varita baja uno[...]

Iggy, al otro lado, dejó escapar una sonrisa ladeada, más por la inercia del momento que por orgullo.

—Has estado muy bien —dijo, acercándose un par de pasos—. Si hubieras lanzado un segundo antes, el resultado habría sido diferente.

No era del todo cierto, pero tampoco sonaba a mentira. Galatea alzó la vista hacia él, parpadeando con lentitud.

—Me quedé pensando.

—Ya —respondió él, sin burla, más bien con cierta familiaridad—. Lo sueles hacer.

No añadió nada más. Tampoco hacía falta. Se entendían lo suficiente como para no estirar demasiado las cosas. Ae apareció poco después, llamando a Iggy con un gesto de cabeza.

—Voy con ella un rato —comentó, señalando con el pulgar hacia atrás—. Luego si quieres repetimos.

Galatea asintió ligeramente, ya algo distraída otra vez, y los vio alejarse sin más. No había prisa en su forma de recoger, ni tampoco en la decisión de marcharse después hacia la enfermería. E[...]

Madame Pomfrey no estaba cuando llegó a la Enfermería, así que ocupó una de las camas sin hacer ruido y empezó a apañarse sola. Desenrolló una venda con cuidado, deteniéndose a mitad de gesto [...]

Estaba concentrada en eso cuando la puerta se abrió de nuevo, con mucha más prisa que antes. Ignatius entró con el pelo algo revuelto y la respiración todavía un poco acelerada, como si no hubier[...]

—Vale —soltó al entrar, medio riéndose—. Ae es muy habilidosa.

Galatea levantó la vista. Lo observó un momento en silencio, deteniéndose en los detalles sin decir nada de inmediato.

—¿Te ha dado fuerte?

—Un poco —respondió él, dejándose caer en la cama de al lado—. Pero bien, o sea… —se encogió de hombros—. Aprendo de verdad de esta forma.

No sonaba molesto. Más bien algo frustrado, pero con esa manera ligera que no termina de quedarse. Galatea dejó lo que estaba haciendo y se levantó, acercándose despacio. Tomó el mismo frasco que[...]

—Te va a escocer un poco —dijo, casi en un murmullo, mientras se sentaba a su lado.

Iggy giró la cabeza hacia ella, apoyando el codo sobre su propia pierna.

—Confío en ti.

Galatea empezó a aplicar el ungüento con cuidado sobre la piel enrojecida. Sus movimientos eran suaves, algo lentos, pero atentos. No parecía insegura, solo estaba concentrada en no hacerle daño. [...]

—No se te da mal —comentó, mirándola de reojo—. En serio.

Galatea no respondió enseguida. Terminó de cubrir la zona antes de coger una venda.

—Lo he visto hacer muchas veces.

—Ya, pero verlo no es lo mismo.

Ella se encogió ligeramente de hombros, como si no terminara de darle importancia. Hubo un silencio breve, cómodo. 

—Igual deberíamos entrenar más —dijo—. Tú y yo. Pero sin que nadie nos meta prisa.

Galatea terminó de ajustar la venda con un gesto sencillo.

—Vale.

No había entusiasmo exagerado en su voz, pero sí algo parecido a una decisión tranquila. Se apartó después, dejando el frasco en su sitio.

—Ae es rápida —añadió él, mirando al techo—. Pero tú ves cosas antes.

Galatea se quedó quieta un segundo.

—A veces —murmuró. No parecía convencida del todo, pero tampoco lo negaba. Iggy cerró los ojos un momento, respirando más despacio.

—Gracias, Galatea.

Ella asintió apenas, levantándose del asiento con la mirada desviándose otra vez hacia la mesa de Madame Pomfrey. </div>
